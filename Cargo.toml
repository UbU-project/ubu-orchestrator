[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
yup-oauth2 = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "c77c0a2d1c3e206b8c18c023bb8b4ee0d06eb2d0" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "7b24cd82d78b70eea9c49f8816778a10b320b8ed" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "4c7e3b6d31008a3bd64f28c303b8aa01bca3e2a0" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "ed742967f0d8cb60b5088fa0959d81a0d42c6ed6", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "ed742967f0d8cb60b5088fa0959d81a0d42c6ed6", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
