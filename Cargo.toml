[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
yup-oauth2 = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "c4b624d76f210f77f865c61801e02c89219763ce" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "9e471a46b357f99cff567c250ae59084a6768b52" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "50fae565e6d48fb5c41107ab3259096ad243ccf3" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "8af10ece07043c307fe351ac867cfd8449e08c4f", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "8af10ece07043c307fe351ac867cfd8449e08c4f", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
