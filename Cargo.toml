[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
yup-oauth2 = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "8ffc936257331c50cd03773c9d1333a3344cf4cc" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "a6ae9b82170b03e231a196d1b9341bfa0e20fce8" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "999e0e2f50388db6c5b999449c8620c750f288cf" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "072867285ba267bb9caee28a12fb33c6ede51c2b", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "072867285ba267bb9caee28a12fb33c6ede51c2b", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
