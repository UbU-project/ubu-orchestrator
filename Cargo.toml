[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "cc2087f7e9bb54029a60b34916d4ac6d291604f0" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "ddee9621525f77fac29c28dc513cb2bf4b463419" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "2ffb7f47e2d2806828c29badfa9c8869a0641a68" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "1cae4f0c82013a48b7899ce3050fbd7bab094e75", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "1cae4f0c82013a48b7899ce3050fbd7bab094e75", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
