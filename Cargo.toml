[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
yup-oauth2 = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "8d8d8e4a790ed4a641029f8de2799ef129351aaf" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "8621bf44465b697030eedf66e38ab89354f99f85" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "f8b189ab24374f3cd187280172c720a6aaa1a44c" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "f50c3e9a01a2908dbfa61793189b3d04dadf9c8d", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "f50c3e9a01a2908dbfa61793189b3d04dadf9c8d", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
