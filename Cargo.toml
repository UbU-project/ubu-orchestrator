[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "867c7a95edcba452470604c8fbce33b2d96986c1" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "f5831d5725d2f781d3221a0885257d0b4fbe1cf2" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "c9cae5016fd5ec2a469f0e22f605d1c8c1960f1e" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "95c0e05d11ebf12e5e8717591818eb7670dca5e1", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "95c0e05d11ebf12e5e8717591818eb7670dca5e1", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
