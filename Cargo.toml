[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "e02267763f86750a40a84b3c47d1a8f0d173084b" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "6fa8826cee7c75590e64f823c43911b2702dd0ca" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "e47d5bf2e2c14d84320061cbf476570820059faf" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "6595bfe5c38cf62f56fe2a777330017d967d7283", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "6595bfe5c38cf62f56fe2a777330017d967d7283", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
