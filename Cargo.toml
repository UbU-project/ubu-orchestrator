[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
yup-oauth2 = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "46135fea0312bab3606e467c3012d7327096d400" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "b80787d86c235a754b285cb80c800fea2e178e54" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "2a253029b8dea8a824aff970532face21a6c354e" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "8413a270cd2525b515501563e78fde474f112f48", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "8413a270cd2525b515501563e78fde474f112f48", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
