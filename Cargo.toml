[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "358086dba4575984beccdaa7f5cc0d457a276fe9" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "0b455526b022b9d450a513ddbf55e59b3e3fc4db" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "36161252a1e7615251d642bea2061abb4e8b48c5" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "807a704ae35ac077e22c50d5514e3f59118d4e89", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "807a704ae35ac077e22c50d5514e3f59118d4e89", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
