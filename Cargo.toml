[package]
name = "ubu_orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UbU-project/ubu-orchestrator"
description = "Local async orchestration service for UbU Phase 1 dogfooding."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.9"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }

ubu_core = { git = "https://github.com/UbU-project/ubu-core", rev = "72b3ad8d5734d30443ea62f721833212e6da5e25" }
ubu_store = { git = "https://github.com/UbU-project/ubu-store", rev = "eeacb6ef969dceaf917ff30babcb185114098a8b" }
ubu_github_adapter = { git = "https://github.com/UbU-project/ubu-github-adapter", rev = "963d2c834aa7236ca31ea32d0acc64f0e8d82341" }
ubu_planning_core = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "cf8b2ca41fdca0fb90e14e21369ae51d154c9330", package = "ubu_planning_core" }
ubu_planning_cpu = { git = "https://github.com/UbU-project/ubu-planning-kernel", rev = "cf8b2ca41fdca0fb90e14e21369ae51d154c9330", package = "ubu_planning_cpu" }


[dev-dependencies]
http-body-util = "0.1"
